<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#8b949e"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#3fb950"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#f85149"/></marker>
  </defs>
  <rect width="1200" height="780" fill="#0d1117"/>
  <text x="28" y="38" fill="#e6edf3" font-size="22" font-weight="600">Cloud Cost Watchdog with Auto-Shutdown</text>
  <text x="28" y="60" fill="#8b949e" font-size="13">opt-in by tag · five safety gates · measured savings · policy prevents the waste auto-shutdown cannot reach</text>

  <!-- scheduler -->
  <rect x="30" y="100" width="230" height="150" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="145" y="124" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle">scheduler</text>
  <text x="44" y="144" fill="#c9d1d9" font-size="10">timer · every 15 min</text>
  <text x="44" y="162" fill="#6e7681" font-size="10">reads schedule tag → local time</text>
  <text x="44" y="178" fill="#6e7681" font-size="10">builds stop/start command</text>
  <text x="44" y="194" fill="#6e7681" font-size="10">runs 5 gates → queues only</text>
  <text x="44" y="210" fill="#3fb950" font-size="10">decides, never acts</text>
  <text x="44" y="232" fill="#6e7681" font-size="9">malformed schedule → error, never a guess</text>

  <!-- queues -->
  <rect x="300" y="100" width="180" height="66" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.4"/>
  <text x="390" y="124" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">stop-commands</text>
  <text x="390" y="142" fill="#6e7681" font-size="9" text-anchor="middle">separate queue</text>
  <text x="390" y="156" fill="#6e7681" font-size="9" text-anchor="middle">cannot be parsed as start</text>
  <rect x="300" y="182" width="180" height="66" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.4"/>
  <text x="390" y="206" fill="#d29922" font-size="11" font-weight="600" text-anchor="middle">start-commands</text>
  <text x="390" y="224" fill="#6e7681" font-size="9" text-anchor="middle">restores recorded</text>
  <text x="390" y="238" fill="#6e7681" font-size="9" text-anchor="middle">capacity, not 1</text>
  <line x1="264" y1="150" x2="296" y2="140" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="264" y1="200" x2="296" y2="210" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- gates -->
  <rect x="300" y="280" width="180" height="250" rx="8" fill="#0b1020" stroke="#f85149" stroke-width="1.5"/>
  <text x="390" y="304" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">five gates</text>
  <g font-size="9.5" fill="#c9d1d9">
    <text x="312" y="326">1  opt-in tag</text>
    <text x="320" y="340" fill="#6e7681">no tag = abort</text>
    <text x="312" y="362">2  environment</text>
    <text x="320" y="376" fill="#6e7681">prod always aborts</text>
    <text x="312" y="398">3  protected type</text>
    <text x="320" y="412" fill="#6e7681">firewall, KV, DNS, LAW</text>
    <text x="312" y="434">4  keep-alive</text>
    <text x="320" y="448" fill="#6e7681">owner grace period</text>
    <text x="312" y="470">5  idempotency</text>
    <text x="320" y="484" fill="#6e7681">already stopped = no-op</text>
  </g>
  <text x="312" y="512" fill="#f85149" font-size="9">first failure wins · order matters</text>

  <!-- workers -->
  <rect x="530" y="100" width="220" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="640" y="124" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">shutdown</text>
  <text x="544" y="144" fill="#c9d1d9" font-size="10">re-reads LIVE state</text>
  <text x="544" y="160" fill="#6e7681" font-size="9">re-runs gates (state may have</text>
  <text x="544" y="172" fill="#6e7681" font-size="9">changed since it was queued)</text>
  <text x="544" y="192" fill="#c9d1d9" font-size="10">VM → deallocate (not stop)</text>
  <text x="544" y="204" fill="#6e7681" font-size="9">a stopped VM still bills compute</text>

  <rect x="530" y="228" width="220" height="96" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="640" y="252" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">startup</text>
  <text x="544" y="272" fill="#c9d1d9" font-size="10">restores recorded capacity</text>
  <text x="544" y="288" fill="#6e7681" font-size="9">AKS 4 nodes → 4 nodes, not 1</text>
  <text x="544" y="308" fill="#3fb950" font-size="9">only the idempotency gate applies</text>

  <line x1="484" y1="133" x2="526" y2="140" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="484" y1="215" x2="526" y2="260" stroke="#8b949e" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M 390 278 C 390 262 480 250 520 250" fill="none" stroke="#f85149" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- arm -->
  <rect x="810" y="100" width="360" height="150" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="1.6"/>
  <text x="990" y="124" fill="#a371f7" font-size="12" font-weight="600" text-anchor="middle">Azure Resource Manager</text>
  <text x="824" y="146" fill="#c9d1d9" font-size="10">managed identity · Reader + VM Contributor</text>
  <text x="824" y="164" fill="#6e7681" font-size="9">no Contributor: the role cannot create or delete</text>
  <text x="824" y="186" fill="#c9d1d9" font-size="10">tags stamped on the resource:</text>
  <text x="824" y="204" fill="#6e7681" font-size="9">lastAction · lastActionAt · lastActionBy</text>
  <text x="824" y="226" fill="#6e7681" font-size="9">merge semantics — losing autoShutdown would</text>
  <text x="824" y="238" fill="#6e7681" font-size="9">silently opt the resource out</text>
  <line x1="754" y1="150" x2="806" y2="160" stroke="#a371f7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- store -->
  <rect x="810" y="278" width="360" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="990" y="302" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">Cosmos DB · costwatchdog</text>
  <text x="824" y="324" fill="#c9d1d9" font-size="10">decisions (append-only, 90d TTL)</text>
  <text x="824" y="344" fill="#c9d1d9" font-size="10">actions (what actually happened)</text>
  <text x="824" y="364" fill="#c9d1d9" font-size="10">policies (keep-alive requests)</text>
  <text x="824" y="386" fill="#6e7681" font-size="9">"why didn't it stop X" is a query, not an archaeology dig</text>

  <!-- report / anomaly -->
  <rect x="530" y="360" width="220" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="640" y="384" fill="#58a6ff" font-size="12" font-weight="600" text-anchor="middle">report · daily 07:00 IST</text>
  <text x="544" y="404" fill="#c9d1d9" font-size="9.5">stop/start pairs → stopped hours</text>
  <text x="544" y="420" fill="#c9d1d9" font-size="9.5">× Retail Prices API (live)</text>
  <text x="544" y="440" fill="#3fb950" font-size="9.5">= measured, defensible saving</text>
  <text x="544" y="460" fill="#6e7681" font-size="9">unpriced resources are counted,</text>
  <text x="544" y="472" fill="#6e7681" font-size="9">not silently dropped</text>

  <rect x="530" y="506" width="220" height="120" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="640" y="530" fill="#d29922" font-size="12" font-weight="600" text-anchor="middle">anomaly · hourly</text>
  <text x="544" y="550" fill="#c9d1d9" font-size="9.5">today's hour vs same hour, 7d</text>
  <text x="544" y="568" fill="#c9d1d9" font-size="9.5">delta &gt; 3σ  AND  &gt; ₹500</text>
  <text x="544" y="588" fill="#6e7681" font-size="9">the absolute floor stops a quiet</text>
  <text x="544" y="600" fill="#6e7681" font-size="9">dev sub alerting on ₹12</text>
  <text x="544" y="620" fill="#f85149" font-size="9">alerts a human — never turns anything off</text>
  <path d="M 754 340 C 790 340 790 400 754 420" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- policy strip -->
  <rect x="30" y="560" width="450" height="180" rx="8" fill="#0b1020" stroke="#3fb950" stroke-width="1.5"/>
  <text x="48" y="586" fill="#3fb950" font-size="12" font-weight="600">Preventive controls — the bigger saving</text>
  <g font-size="10">
    <text x="48" y="610" fill="#c9d1d9">deny-untagged-vm</text>
    <text x="200" y="610" fill="#6e7681">a resource the watchdog cannot see is waste</text>
    <text x="48" y="632" fill="#c9d1d9">deny-expensive-sku-in-dev</text>
    <text x="200" y="632" fill="#6e7681">an E16 left in dev for a week ≈ ₹15,000</text>
    <text x="48" y="654" fill="#c9d1d9">auto-tag-from-rg (Modify)</text>
    <text x="200" y="654" fill="#6e7681">tag inheritance does not exist; this is it</text>
    <text x="48" y="676" fill="#c9d1d9">deny-public-ip-in-dev</text>
    <text x="200" y="676" fill="#6e7681">cost and attack surface in one rule</text>
    <text x="48" y="698" fill="#c9d1d9">budget 80% actual / 100% forecast</text>
    <text x="200" y="698" fill="#6e7681">works even when the watchdog is broken</text>
  </g>
  <text x="48" y="724" fill="#d29922" font-size="9">rollout: Audit first, then Deny — a deny set on a live estate blocks the fix too</text>

  <!-- savings callout -->
  <rect x="810" y="424" width="360" height="200" rx="8" fill="#0b1020" stroke="#30363d"/>
  <text x="826" y="450" fill="#e6edf3" font-size="12" font-weight="600">Measured result (30 days, 34 resources)</text>
  <text x="826" y="474" fill="#c9d1d9" font-size="10">VMs (18)          3,540 stopped h   ₹28,320</text>
  <text x="826" y="494" fill="#c9d1d9" font-size="10">AKS pools (4)     2,940 stopped h   ₹11,760</text>
  <text x="826" y="514" fill="#c9d1d9" font-size="10">SQL serverless (3) 2,700 stopped h    ₹2,180</text>
  <text x="826" y="534" fill="#d29922" font-size="10">App Service (9)   4,050 stopped h        ₹0 *</text>
  <text x="826" y="550" fill="#6e7681" font-size="9">* the plan is billed whether the app runs</text>
  <text x="826" y="574" fill="#3fb950" font-size="12" font-weight="600">Total  ₹42,260 · watchdog cost ₹900</text>
  <text x="826" y="596" fill="#6e7681" font-size="9">method: retail hourly price × measured stopped hours</text>
  <text x="826" y="612" fill="#6e7681" font-size="9">from the action log — never from the schedule</text>
</svg>
